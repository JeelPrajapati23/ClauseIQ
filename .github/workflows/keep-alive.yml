# Keeps the Render free-tier backend from sleeping (it spins down after ~15 min
# idle). Pings /health every 10 minutes.
#
# Caveats:
# - GitHub doesn't guarantee cron timing; runs can be delayed by several minutes
#   under load, so an occasional cold start can still slip through.
# - GitHub auto-disables scheduled workflows after 60 days with no repo
#   activity — re-enable from the Actions tab if that happens.
# - Render's free tier gives 750 instance-hours/month per workspace; one
#   always-on service (~744h) fits, but a second free service would not.
name: Keep Render backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl --fail --silent --show-error \
               --retry 3 --retry-delay 20 --retry-all-errors \
               --max-time 60 \
               https://clauseiq-backend-q90j.onrender.com/health
